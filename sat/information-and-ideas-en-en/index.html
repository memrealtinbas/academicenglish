<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Information and Ideas (EN–EN)</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f4f7;--card:#fff;--ink:#222b36;--mute:#697685;--line:#d6dce3;--acc:#41586f;--accink:#fff;--ok:#2f7d5b;--okbg:#e5f3ec;--bad:#a8483c;--badbg:#f7e7e4;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171b20;--card:#1f252c;--ink:#e8ecf0;--mute:#98a3ae;--line:#343d47;--acc:#9bb5cc;--accink:#10202e;--ok:#7cc9a0;--okbg:#1c3328;--bad:#e59a8f;--badbg:#3a2420}}
:root[data-theme="dark"]{--bg:#171b20;--card:#1f252c;--ink:#e8ecf0;--mute:#98a3ae;--line:#343d47;--acc:#9bb5cc;--accink:#10202e;--ok:#7cc9a0;--okbg:#1c3328;--bad:#e59a8f;--badbg:#3a2420}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.45}
main{max-width:640px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.5rem;font-weight:800;margin:4px 0 14px}
.tabs{display:flex;gap:8px;margin-bottom:18px}
.tabs button{flex:1;padding:11px;border:2px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;font:inherit;font-weight:600;cursor:pointer}
.tabs button[aria-selected=true]{background:var(--acc);border-color:var(--acc);color:var(--accink)}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.meta{display:flex;justify-content:space-between;color:var(--mute);font-size:.9rem;margin-bottom:8px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:16px}
.bar i{display:block;height:100%;background:var(--acc);width:0;transition:width .2s}
.fc{width:100%;min-height:240px;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:24px;font:inherit;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px}
.fc .w{font-size:2.2rem;font-weight:800}
.fc .tr{font-size:2rem;font-weight:800;color:var(--acc)}
.fc .hint,.fc .syn{color:var(--mute);font-size:.95rem}
.row{display:flex;gap:8px;margin-top:14px}
.btn{flex:1;padding:12px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:600;cursor:pointer}
.btn.p{background:var(--acc);border-color:var(--acc);color:var(--accink)}
.q{font-size:2rem;font-weight:800;text-align:center;margin:10px 0 20px}
.opts{display:grid;gap:10px}
.opt{padding:14px 16px;text-align:left;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:1.05rem;cursor:pointer}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt:disabled{cursor:default;color:var(--ink)}
.fb{margin-top:14px;min-height:24px;font-weight:600}
.res{text-align:center}
.score{font-size:3rem;font-weight:800;color:var(--acc);margin:8px 0}
.miss{text-align:left;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:6px 16px;margin:16px 0;max-height:320px;overflow-y:auto}
.miss div{padding:8px 0;border-bottom:1px solid var(--line)}
.miss div:last-child{border:0}
.back{display:inline-block;margin-bottom:6px;color:var(--acc);text-decoration:none;font-weight:600}
.back:hover{text-decoration:underline}
.hide{display:none}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<main>
<a class="back" href="../">‹ SAT</a>
<h1>Information and Ideas (EN–EN)</h1>
<div class="tabs" role="tablist">
<button role="tab" id="t-fc" aria-selected="true">Cards (200)</button>
<button role="tab" id="t-qz" aria-selected="false">Quiz (30 questions)</button>
</div>

<section id="fc-s">
<div class="meta"><span id="fc-n"></span><span>Tap to view meaning · Use ← → to navigate</span></div>
<div class="bar"><i id="fc-b"></i></div>
<button class="fc" id="fc" aria-live="polite"></button>
<div class="row">
<button class="btn" id="prev">Previous</button>
<button class="btn" id="shuf">Shuffle</button>
<button class="btn p" id="next">Next</button>
</div>
<div class="row"><button class="btn p" id="go-q">Start Quiz</button></div>
</section>

<section id="qz-s" class="hide">
<div id="qz"></div>
</section>
</main>
<script>
var RAW="V|rem|Abandon|Leave;V|down|Abate|Lessen;J|size|Abundant|Plentiful;V|up|Accelerate|Speed up;V|chg|Accommodate|Adapt;V|get|Accumulate|Gather;V|acc|Acknowledge|Recognize;V|sup|Advocate|Support;V|org|Allocate|Distribute;V|chg|Alter|Change;J|doubt|Ambiguous|Unclear;J|size|Ample|Sufficient;J|sim|Analogous|Comparable;N|diff|Anomaly|Irregularity;V|inf|Anticipate|Expect;J|clear|Apparent|Obvious;J|doubt|Arbitrary|Random;V|claim|Assert|Claim;V|eval|Assess|Evaluate;V|attr|Attribute|Ascribe;J|cert|Authentic|Genuine;V|up|Bolster|Strengthen;V|rem|Cease|Stop;J|logic|Coherent|Logical;V|sim|Coincide|Correspond;J|cert|Compelling|Convincing;V|org|Compensate|Make up for;V|get|Compile|Collect;V|up|Complement|Complete;V|org|Comprise|Consist of;V|idea|Conceive|Imagine;J|cert|Conclusive|Decisive;V|down|Condense|Shorten;N|idea|Conjecture|Speculation;N|acc|Consensus|Agreement;R|res|Consequently|Therefore;V|lim|Constrain|Restrict;V|claim|Contend|Argue;V|ref|Contradict|Oppose;J|trad|Conventional|Traditional;V|desc|Convey|Communicate;V|est|Corroborate|Confirm;J|imp|Crucial|Essential;J|up|Cumulative|Accumulated;V|eval|Deem|Consider;V|down|Diminish|Reduce;N|diff|Discrepancy|Difference;J|diff|Discrete|Separate;N|diff|Disparity|Inequality;V|ref|Dispute|Challenge;J|diff|Distinct|Different;J|diff|Diverse|Varied;V|up|Dominate|Control;V|desc|Elucidate|Clarify;V|imp|Emphasize|Highlight;J|data|Empirical|Evidence-based;V|up|Enhance|Improve;V|est|Establish|Demonstrate;V|up|Exaggerate|Overstate;V|up|Exceed|Surpass;V|rem|Exclude|Omit;J|clear|Explicit|Clear;V|act|Exploit|Utilize;V|sup|Facilitate|Enable;J|cert|Feasible|Possible;V|chg|Fluctuate|Vary;J|imp|Fundamental|Basic;V|ca|Generate|Produce;J|cert|Genuine|Authentic;V|claim|Hypothesize|Propose;V|show|Imply|Suggest;V|lim|Impose|Enforce;J|size|Inadequate|Insufficient;N|goal|Incentive|Motivation;J|imp|Incidental|Secondary;V|org|Incorporate|Include;V|show|Indicate|Show;V|inf|Infer|Deduce;J|cert|Inherent|Intrinsic;V|lim|Inhibit|Hinder;J|time|Initial|First;J|new|Innovative|Original;V|org|Integrate|Combine;V|desc|Interpret|Explain;J|comp|Intricate|Complex;V|sup|Justify|Validate;R|emph|Largely|Mainly;V|show|Manifest|Demonstrate;J|size|Marginal|Minor;V|chg|Modify|Adjust;J|imp|Notable|Remarkable;N|idea|Notion|Idea;V|get|Obtain|Acquire;V|rem|Omit|Exclude;V|org|Offset|Counterbalance;N|diff|Paradox|Contradiction;J|imp|Paramount|Supreme;V|acc|Perceive|Recognize;V|keep|Persist|Continue;J|cert|Plausible|Believable;V|time|Precede|Come before;J|imp|Predominant|Main;V|keep|Preserve|Maintain;V|claim|Presume|Assume;V|up|Prevail|Dominate;V|lim|Prohibit|Forbid;V|sup|Promote|Encourage;N|sup|Proponent|Supporter;N|data|Proportion|Share;V|act|Pursue|Seek;J|logic|Rational|Logical;V|acc|Reconcile|Resolve;V|chg|Refine|Improve;V|up|Reinforce|Strengthen;V|ref|Reject|Dismiss;J|imp|Relevant|Pertinent;J|doubt|Reluctant|Hesitant;J|imp|Remarkable|Extraordinary;V|ca|Render|Make;V|sim|Replicate|Reproduce;V|keep|Retain|Keep;V|show|Reveal|Disclose;J|lim|Rigid|Inflexible;J|cert|Robust|Strong;J|size|Scarce|Rare;V|exam|Scrutinize|Examine;J|time|Simultaneous|Concurrent;J|imp|Subordinate|Secondary;J|time|Subsequent|Later;J|size|Substantial|Considerable;V|est|Substantiate|Support;V|chg|Substitute|Replace;J|comp|Subtle|Slight;J|size|Sufficient|Adequate;V|up|Surpass|Exceed;V|keep|Sustain|Maintain;J|doubt|Tentative|Uncertain;J|idea|Theoretical|Conceptual;V|ref|Undermine|Weaken;J|imp|Underlying|Fundamental;J|new|Unprecedented|Never-before-seen;J|logic|Valid|Sound;V|diff|Vary|Differ;J|cert|Viable|Workable;V|sup|Warrant|Justify;V|ca|Yield|Produce;V|rem|Abolish|Eliminate;J|idea|Abstract|Theoretical;J|tone_neg|Adverse|Harmful;N|rel|Affinity|Attraction;V|down|Alleviate|Relieve;J|tone_pos|Assertive|Confident;V|get|Attain|Achieve;V|attr|Attribute|Credit;N|bias|Bias|Prejudice;J|tone_neu|Cautious|Careful;V|rem|Circumvent|Bypass;V|desc|Clarify|Explain;V|hide|Conceal|Hide;J|time|Concurrent|Simultaneous;V|lim|Confine|Limit;V|acc|Conform|Comply;J|sim|Consistent|Uniform;V|exam|Contemplate|Consider;J|diff|Contrasting|Differing;V|down|Deplete|Exhaust;V|get|Derive|Obtain;V|id|Detect|Identify;V|ca|Devise|Invent;J|tone_neg|Detrimental|Damaging;V|rem|Discard|Abandon;V|show|Disclose|Reveal;V|ref|Disrupt|Disturb;V|show|Emerge|Appear;V|sup|Endorse|Approve;V|chg|Evolve|Develop;V|up|Exacerbate|Worsen;V|act|Exert|Apply;V|sup|Foster|Encourage;V|lim|Hinder|Obstruct;V|show|Illustrate|Demonstrate;N|diff|Inconsistency|Contradiction;J|imp|Indispensable|Essential;J|size|Infrequent|Rare;V|up|Intensify|Strengthen;J|cert|Intrinsic|Inherent;V|ref|Negate|Nullify;V|hide|Obscure|Conceal;V|keep|Persist|Endure;J|size|Prevalent|Widespread;V|lim|Prohibit|Prevent;V|up|Proliferate|Multiply;V|ca|Prompt|Cause;V|ca|Provoke|Trigger;V|sim|Resemble|Mirror;J|cert|Resilient|Adaptable;V|lim|Restrict|Limit;J|imp|Significant|Meaningful;V|up|Supplement|Add to;V|chg|Transform|Convert";
var T=RAW.split(";").map(function(r){var p=r.split("|");return{c:p[0],t:p[1]?p[1].split(","):[],en:p[2],tr:p[3]}}).filter(function(x){return x.en&&x.tr});
var $=function(i){return document.getElementById(i)};
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function show(tab){var f=tab==="fc";$("fc-s").classList.toggle("hide",!f);$("qz-s").classList.toggle("hide",f);$("t-fc").setAttribute("aria-selected",f);$("t-qz").setAttribute("aria-selected",!f);if(!f&&!quiz)startQuiz()}
$("t-fc").onclick=function(){show("fc")};$("t-qz").onclick=function(){show("qz")};$("go-q").onclick=function(){show("qz")};

/* Flashcards */
var deck=T.slice(),ci=0,flipped=false;
function drawCard(){var t=deck[ci],b=$("fc");
$("fc-n").textContent=(ci+1)+" / "+deck.length;$("fc-b").style.width=((ci+1)/deck.length*100)+"%";
if(!flipped){b.innerHTML='<div class="w"></div><div class="hint">Tap to view meaning</div>';b.firstChild.textContent=t.en}
else{b.innerHTML='<div class="tr"></div><div class="hint"></div>';
b.children[0].textContent=t.tr;b.children[1].textContent=t.en;}}
function move(d){ci=(ci+d+deck.length)%deck.length;flipped=false;drawCard()}
$("fc").onclick=function(){flipped=!flipped;drawCard()};
$("prev").onclick=function(){move(-1)};$("next").onclick=function(){move(1)};
$("shuf").onclick=function(){deck=shuffle(T);ci=0;flipped=false;drawCard()};
document.addEventListener("keydown",function(e){if($("fc-s").classList.contains("hide"))return;
if(e.key==="ArrowRight")move(1);else if(e.key==="ArrowLeft")move(-1);else if(e.key===" "&&document.activeElement.tagName!=="BUTTON"){e.preventDefault();flipped=!flipped;drawCard()}});
drawCard();

/* Quiz */
var quiz=null;
function uniqTr(list){var u=[],k={};shuffle(list).forEach(function(x){if(!k[x.tr]){k[x.tr]=1;u.push(x.tr)}});return u}
function makeQ(t){
var d=uniqTr(T.filter(function(x){return x.c===t.c&&x.tr!==t.tr}));
if(d.length<3){d=d.concat(uniqTr(T.filter(function(x){return x.tr!==t.tr&&d.indexOf(x.tr)<0})))}
return{en:t.en,ans:t.tr,opts:shuffle([t.tr].concat(d.slice(0,3)))}}
function startQuiz(){quiz={qs:shuffle(T).slice(0,30).map(makeQ),i:0,score:0,miss:[],done:false};drawQ()}
function drawQ(){var q=quiz,root=$("qz");
if(q.i>=q.qs.length){var m=q.miss.map(function(x){return"<div><b>"+x.en+"</b> = "+x.ans+"</div>"}).join("");
root.innerHTML='<div class="res"><div>Results</div><div class="score">'+q.score+' / '+q.qs.length+'</div>'+(q.miss.length?'<div>Missed words</div><div class="miss">'+m+'</div>':'<div>All correct!</div>')+'<div class="row"><button class="btn" id="again">New 30 questions</button><button class="btn p" id="tofc">Back to cards</button></div></div>';
$("again").onclick=startQuiz;$("tofc").onclick=function(){show("fc")};return}
var cur=q.qs[q.i];
root.innerHTML='<div class="meta"><span>Question '+(q.i+1)+' / '+q.qs.length+'</span><span>Score: '+q.score+'</span></div><div class="bar"><i style="width:'+(q.i/q.qs.length*100)+'%"></i></div><div class="q"></div><div class="opts"></div><div class="fb" aria-live="polite"></div><div class="row hide" id="nx"><button class="btn p" id="nxb"></button></div>';
root.querySelector(".q").textContent=cur.en;
var box=root.querySelector(".opts");
cur.opts.forEach(function(o){var b=document.createElement("button");b.className="opt";b.textContent=o;b.onclick=function(){pick(b,o)};box.appendChild(b)})}
function pick(btn,o){var q=quiz,cur=q.qs[q.i],all=document.querySelectorAll(".opt"),fb=document.querySelector(".fb");
all.forEach(function(b){b.disabled=true;if(b.textContent===cur.ans)b.classList.add("ok")});
if(o===cur.ans){q.score++;fb.textContent="Correct!"}else{btn.classList.add("bad");q.miss.push(cur);fb.textContent="Correct answer: "+cur.ans}
var last=q.i===q.qs.length-1;$("nx").classList.remove("hide");$("nxb").textContent=last?"See results":"Next question";
$("nxb").onclick=function(){q.i++;drawQ()};$("nxb").focus()}
</script>
</body>
</html>
