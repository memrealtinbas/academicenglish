<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Words in Context (EN–TR)</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f4f7;--card:#fff;--ink:#222b36;--mute:#697685;--line:#d6dce3;--acc:#41586f;--accink:#fff;--ok:#2f7d5b;--okbg:#e5f3ec;--bad:#a8483c;--badbg:#f7e7e4;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171b20;--card:#1f252c;--ink:#e8ecf0;--mute:#98a3ae;--line:#343d47;--acc:#9bb5cc;--accink:#10202e;--ok:#7cc9a0;--okbg:#1c3328;--bad:#e59a8f;--badbg:#3a2420}}
:root[data-theme="dark"]{--bg:#171b20;--card:#1f252c;--ink:#e8ecf0;--mute:#98a3ae;--line:#343d47;--acc:#9bb5cc;--accink:#10202e;--ok:#7cc9a0;--okbg:#1c3328;--bad:#e59a8f;--badbg:#3a2420}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.45}
main{max-width:640px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.5rem;font-weight:800;margin:4px 0 14px}
.tabs{display:flex;gap:8px;margin-bottom:18px}
.tabs button{flex:1;padding:11px;border:2px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;font:inherit;font-weight:600;cursor:pointer}
.tabs button[aria-selected=true]{background:var(--acc);border-color:var(--acc);color:var(--accink)}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.meta{display:flex;justify-content:space-between;color:var(--mute);font-size:.9rem;margin-bottom:8px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:16px}
.bar i{display:block;height:100%;background:var(--acc);width:0;transition:width .2s}
.fc{width:100%;min-height:240px;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:24px;font:inherit;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px}
.fc .w{font-size:2.2rem;font-weight:800}
.fc .tr{font-size:2rem;font-weight:800;color:var(--acc)}
.fc .hint,.fc .syn{color:var(--mute);font-size:.95rem}
.row{display:flex;gap:8px;margin-top:14px}
.btn{flex:1;padding:12px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:600;cursor:pointer}
.btn.p{background:var(--acc);border-color:var(--acc);color:var(--accink)}
.q{font-size:2rem;font-weight:800;text-align:center;margin:10px 0 20px}
.opts{display:grid;gap:10px}
.opt{padding:14px 16px;text-align:left;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:1.05rem;cursor:pointer}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt:disabled{cursor:default;color:var(--ink)}
.fb{margin-top:14px;min-height:24px;font-weight:600}
.res{text-align:center}
.score{font-size:3rem;font-weight:800;color:var(--acc);margin:8px 0}
.miss{text-align:left;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:6px 16px;margin:16px 0;max-height:320px;overflow-y:auto}
.miss div{padding:8px 0;border-bottom:1px solid var(--line)}
.miss div:last-child{border:0}
.back{display:inline-block;margin-bottom:6px;color:var(--acc);text-decoration:none;font-weight:600}
.back:hover{text-decoration:underline}
.hide{display:none}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<main>
<a class="back" href="../">‹ SAT</a>
<h1>Words in Context (EN–TR)</h1>
<div class="tabs" role="tablist">
<button role="tab" id="t-fc" aria-selected="true">Kartlar (200)</button>
<button role="tab" id="t-qz" aria-selected="false">Test (30 soru)</button>
</div>

<section id="fc-s">
<div class="meta"><span id="fc-n"></span><span>Çevirmek için dokun · ← → ile gez</span></div>
<div class="bar"><i id="fc-b"></i></div>
<button class="fc" id="fc" aria-live="polite"></button>
<div class="row">
<button class="btn" id="prev">Önceki</button>
<button class="btn" id="shuf">Karıştır</button>
<button class="btn p" id="next">Sonraki</button>
</div>
<div class="row"><button class="btn p" id="go-q">Teste geç</button></div>
</section>

<section id="qz-s" class="hide">
<div id="qz"></div>
</section>
</main>
<script>
var RAW="J||Abundant|Bol, Çok miktarda;J||Accurate|Doğru, Kesin;V||Acknowledge|Kabul etmek, Tanımak;V||Adapt|Uyarlamak;J||Adequate|Yeterli;V||Advocate|Savunmak;J||Ambiguous|Belirsiz, Muğlak;V||Amend|Değiştirmek, Düzeltmek;V||Analyze|Analiz etmek, İncelemek;J||Apparent|Açık, Belirgin;V||Appreciate|Takdir etmek, Farkına varmak;J||Arduous|Zahmetli, Meşakkatli;V||Assert|İddia etmek;V||Assess|Değerlendirmek;V||Attain|Elde etmek, Ulaşmak;V||Attribute|Atfetmek;J||Authentic|Gerçek, Özgün;N||Benefit|Fayda, Yarar;N||Bias|Önyargı, Yanlılık;V||Bolster|Güçlendirmek;J||Brief|Kısa, Öz;J||Cautious|Temkinli, Dikkatli;V||Cease|Durdurmak, Sona ermek;V||Challenge|Sorgulamak, Meydan okumak;J||Characteristic|Karakteristik, Tipik;V||Clarify|Açıklığa kavuşturmak;J||Coherent|Tutarlı, Mantıklı;V||Coincide|Örtüşmek, Aynı zamana denk gelmek;V||Commence|Başlamak;J||Compelling|İkna edici, Güçlü;J||Comprehensive|Kapsamlı;V||Conceive|Tasarlamak, Hayal etmek;V||Conclude|Sonuca varmak;J||Concurrent|Eş zamanlı;V||Condense|Kısaltmak, Yoğunlaştırmak;V||Conduct|Yürütmek, Gerçekleştirmek;V||Confer|Vermek, Bahşetmek;V||Confirm|Doğrulamak;N||Conflict|Çelişki, Çatışma;V||Conform|Uymak;J||Consequent|Sonuç olarak ortaya çıkan;J||Considerable|Önemli ölçüde, Kayda değer;J||Consistent|Tutarlı;V||Constitute|Oluşturmak, Teşkil etmek;V||Constrain|Kısıtlamak;V||Contend|İleri sürmek, Savunmak;V||Contradict|Çelişmek, Aksini iddia etmek;J||Conventional|Geleneksel, Alışılagelmiş;V||Convey|İletmek, Aktarmak;J||Convincing|İkna edici;J||Crucial|Çok önemli, Hayati;V||Cultivate|Geliştirmek, Yetiştirmek;V||Decline|Azalmak, Gerilemek;V||Deduce|Çıkarım yapmak;J||Deficient|Eksik, Yetersiz;V||Demonstrate|Göstermek, Ortaya koymak;V||Denote|Belirtmek, İfade etmek;V||Depict|Betimlemek, Tasvir etmek;V||Derive|Türetmek, Elde etmek;V||Diminish|Azaltmak, Küçültmek;V||Disclose|Açığa çıkarmak;N||Discrepancy|Tutarsızlık, Farklılık;J||Discrete|Ayrı, Bağımsız;V||Discriminate|Ayırt etmek;V||Dispute|İtiraz etmek, Tartışmak;J||Distinct|Farklı, Belirgin;J||Diverse|Çeşitli;V||Dominate|Hâkim olmak, Egemen olmak;V||Elaborate|Ayrıntılandırmak;V||Eliminate|Ortadan kaldırmak;V||Emphasize|Vurgulamak;V||Enable|Olanak sağlamak;V||Encounter|Karşılaşmak;V||Enhance|Geliştirmek, Artırmak;J||Enormous|Muazzam, Çok büyük;V||Ensure|Güvence altına almak, Sağlamak;V||Establish|Ortaya koymak, Kurmak;J||Evident|Açık, Bariz;V||Exaggerate|Abartmak;V||Exceed|Aşmak;V||Exclude|Hariç tutmak;V||Exhibit|Sergilemek, Göstermek;V||Expand|Genişletmek;J||Explicit|Açık, Net;V||Exploit|Kullanmak, Faydalanmak;V||Facilitate|Kolaylaştırmak;J||Feasible|Uygulanabilir, Yapılabilir;V||Fluctuate|Dalgalanmak;J||Fundamental|Temel;V||Generate|Üretmek, Oluşturmak;J||Genuine|Gerçek, Samimi;N||Hypothesis|Hipotez, Varsayım;V||Identify|Belirlemek, Tanımlamak;V||Illustrate|Örneklemek, Açıklamak;V||Imply|İma etmek, Dolaylı olarak belirtmek;V||Incorporate|Dâhil etmek, İçermek;V||Indicate|Göstermek, Belirtmek;J||Inevitable|Kaçınılmaz;V||Infer|Çıkarım yapmak;J||Inherent|Doğasında bulunan, İçkin;J||Initial|İlk, Başlangıçtaki;J||Innovative|Yenilikçi;N||Insight|Kavrayış, Derin anlayış;V||Integrate|Bütünleştirmek;V||Interpret|Yorumlamak;J||Intricate|Karmaşık, Girift;V||Isolate|İzole etmek, Ayırmak;V||Justify|Gerekçelendirmek, Haklı çıkarmak;V||Maintain|Sürdürmek, Korumak;V||Manifest|Ortaya çıkarmak, Göstermek;J||Marginal|Önemsiz, Marjinal;J||Methodical|Sistematik, Yöntemli;V||Mimic|Taklit etmek;V||Modify|Değiştirmek, Düzenlemek;J||Notable|Dikkate değer;N||Notion|Kavram, Düşünce;J||Novel|Yeni, Özgün;V||Obtain|Elde etmek;J||Obvious|Açık, Bariz;V||Occur|Meydana gelmek;V||Omit|Atlamak, Hariç bırakmak;V||Perceive|Algılamak;V||Persist|Israrla devam etmek, Sürmek;J||Plausible|Makul, Akla yatkın;V||Portray|Betimlemek, Tasvir etmek;V||Precede|Önce gelmek;J||Predominant|Baskın, Hâkim;J||Preliminary|Ön hazırlık niteliğinde, İlk;V||Preserve|Korumak, Muhafaza etmek;V||Prevail|Üstün gelmek, Hâkim olmak;J||Prominent|Önde gelen, Belirgin;V||Promote|Teşvik etmek, Desteklemek;V||Propose|Öne sürmek, Teklif etmek;V||Provoke|Kışkırtmak, Tetiklemek;V||Qualify|Sınırlandırmak, Nitelendirmek;J||Radical|Köklü, Radikal;J||Rational|Akılcı, Mantıklı;V||Refine|İyileştirmek, Arıtmak;V||Reinforce|Pekiştirmek, Güçlendirmek;V||Reject|Reddetmek;J||Relevant|İlgili, Konuyla bağlantılı;J||Reluctant|İsteksiz, Gönülsüz;J||Remarkable|Olağanüstü, Dikkat çekici;V||Require|Gerektirmek;V||Resemble|Benzer olmak;V||Resolve|Çözmek, Karara bağlamak;V||Restrict|Kısıtlamak;V||Retain|Muhafaza etmek, Elinde tutmak;V||Reveal|Ortaya çıkarmak;J||Rigid|Katı, Esnek olmayan;J||Significant|Önemli, Kayda değer;J||Simultaneous|Eş zamanlı;J||Skeptical|Şüpheci;R||Solely|Yalnızca, Sadece;J||Stable|İstikrarlı, Sabit;J||Substantial|Önemli, Kayda değer;V||Substitute|Yerine koymak, İkame etmek;J||Subtle|İnce, Belirsiz;J||Sufficient|Yeterli;V||Supplement|Tamamlamak, Takviye etmek;V||Surpass|Geride bırakmak, Aşmak;V||Sustain|Sürdürmek, Devam ettirmek;V||Symbolize|Sembolize etmek, Temsil etmek;N||Tendency|Eğilim;J||Tentative|Geçici, Kesin olmayan;J||Theoretical|Kuramsal, Teorik;J||Thorough|Kapsamlı, Ayrıntılı;V||Transform|Dönüştürmek;J||Transparent|Şeffaf, Açık;V||Undermine|Zayıflatmak, Baltalamak;J||Underlying|Temel, Altta yatan;J||Unique|Eşsiz, Benzersiz;V||Utilize|Kullanmak, Yararlanmak;J||Valid|Geçerli, Sağlam;V||Vary|Değişmek, Farklılık göstermek;V||Verify|Doğrulamak;J||Viable|Uygulanabilir, Yaşayabilir;J||Widespread|Yaygın;V||Abandon|Terk etmek, Vazgeçmek;V||Accelerate|Hızlandırmak;V||Accumulate|Biriktirmek, Toplamak;J||Adverse|Olumsuz, Zararlı;V||Alleviate|Hafifletmek;V||Alter|Değiştirmek;J||Analogous|Benzer, Eşdeğer;V||Anticipate|Öngörmek, Beklemek;J||Arbitrary|Keyfî, Rastgele;J||Assertive|Kendinden emin, Atılgan;V||Attenuate|Zayıflatmak, Azaltmak;V||Consolidate|Birleştirmek, Pekiştirmek;J||Candid|Açık sözlü, Samimi;V||Coexist|Bir arada var olmak;V||Compensate|Telafi etmek;V||Complement|Tamamlamak;J||Conspicuous|Göze çarpan, Belirgin;V||Deteriorate|Kötüleşmek, Bozulmak;V||Dispel|Dağıtmak, Ortadan kaldırmak;V||Exacerbate|Kötüleştirmek, Şiddetlendirmek;V||Mitigate|Hafifletmek, Azaltmak;V||Substantiate|Kanıtlamak, Doğrulamak";
var T=RAW.split(";").map(function(r){var p=r.split("|");return{c:p[0],t:p[1]?p[1].split(","):[],en:p[2],tr:p[3]}});
var $=function(i){return document.getElementById(i)};
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function show(tab){var f=tab==="fc";$("fc-s").classList.toggle("hide",!f);$("qz-s").classList.toggle("hide",f);$("t-fc").setAttribute("aria-selected",f);$("t-qz").setAttribute("aria-selected",!f);if(!f&&!quiz)startQuiz()}
$("t-fc").onclick=function(){show("fc")};$("t-qz").onclick=function(){show("qz")};$("go-q").onclick=function(){show("qz")};

/* Flashcards */
var deck=T.slice(),ci=0,flipped=false;
function drawCard(){var t=deck[ci],b=$("fc");
$("fc-n").textContent=(ci+1)+" / "+deck.length;$("fc-b").style.width=((ci+1)/deck.length*100)+"%";
if(!flipped){b.innerHTML='<div class="w"></div><div class="hint">Tanım için dokun</div>';b.firstChild.textContent=t.en}
else{b.innerHTML='<div class="tr"></div><div class="hint"></div>';
b.children[0].textContent=t.tr;b.children[1].textContent=t.en;}}
function move(d){ci=(ci+d+deck.length)%deck.length;flipped=false;drawCard()}
$("fc").onclick=function(){flipped=!flipped;drawCard()};
$("prev").onclick=function(){move(-1)};$("next").onclick=function(){move(1)};
$("shuf").onclick=function(){deck=shuffle(T);ci=0;flipped=false;drawCard()};
document.addEventListener("keydown",function(e){if($("fc-s").classList.contains("hide"))return;
if(e.key==="ArrowRight")move(1);else if(e.key==="ArrowLeft")move(-1);else if(e.key===" "&&document.activeElement.tagName!=="BUTTON"){e.preventDefault();flipped=!flipped;drawCard()}});
drawCard();

/* Quiz */
var quiz=null;
function uniqTr(list){var u=[],k={};shuffle(list).forEach(function(x){if(!k[x.tr]){k[x.tr]=1;u.push(x.tr)}});return u}
function makeQ(t){
var d=uniqTr(T.filter(function(x){return x.c===t.c&&x.tr!==t.tr}));
if(d.length<3){d=d.concat(uniqTr(T.filter(function(x){return x.tr!==t.tr&&d.indexOf(x.tr)<0})))}
return{en:t.en,ans:t.tr,opts:shuffle([t.tr].concat(d.slice(0,3)))}}
function startQuiz(){quiz={qs:shuffle(T).slice(0,30).map(makeQ),i:0,score:0,miss:[],done:false};drawQ()}
function drawQ(){var q=quiz,root=$("qz");
if(q.i>=q.qs.length){var m=q.miss.map(function(x){return"<div><b>"+x.en+"</b> = "+x.ans+"</div>"}).join("");
root.innerHTML='<div class="res"><div>Sonuç</div><div class="score">'+q.score+' / '+q.qs.length+'</div>'+(q.miss.length?'<div>Yanlış yaptıkların</div><div class="miss">'+m+'</div>':'<div>Hepsi doğru!</div>')+'<div class="row"><button class="btn" id="again">Yeni 30 soru</button><button class="btn p" id="tofc">Kartlara dön</button></div></div>';
$("again").onclick=startQuiz;$("tofc").onclick=function(){show("fc")};return}
var cur=q.qs[q.i];
root.innerHTML='<div class="meta"><span>Soru '+(q.i+1)+' / '+q.qs.length+'</span><span>Doğru: '+q.score+'</span></div><div class="bar"><i style="width:'+(q.i/q.qs.length*100)+'%"></i></div><div class="q"></div><div class="opts"></div><div class="fb" aria-live="polite"></div><div class="row hide" id="nx"><button class="btn p" id="nxb"></button></div>';
root.querySelector(".q").textContent=cur.en;
var box=root.querySelector(".opts");
cur.opts.forEach(function(o){var b=document.createElement("button");b.className="opt";b.textContent=o;b.onclick=function(){pick(b,o)};box.appendChild(b)})}
function pick(btn,o){var q=quiz,cur=q.qs[q.i],all=document.querySelectorAll(".opt"),fb=document.querySelector(".fb");
all.forEach(function(b){b.disabled=true;if(b.textContent===cur.ans)b.classList.add("ok")});
if(o===cur.ans){q.score++;fb.textContent="Doğru!"}else{btn.classList.add("bad");q.miss.push(cur);fb.textContent="Doğru cevap: "+cur.ans}
var last=q.i===q.qs.length-1;$("nx").classList.remove("hide");$("nxb").textContent=last?"Sonucu gör":"Sonraki soru";
$("nxb").onclick=function(){q.i++;drawQ()};$("nxb").focus()}
</script>
</body>
</html>
