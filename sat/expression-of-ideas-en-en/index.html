<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Expression of Ideas (EN–EN)</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f4f7;--card:#fff;--ink:#222b36;--mute:#697685;--line:#d6dce3;--acc:#41586f;--accink:#fff;--ok:#2f7d5b;--okbg:#e5f3ec;--bad:#a8483c;--badbg:#f7e7e4;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171b20;--card:#1f252c;--ink:#e8ecf0;--mute:#98a3ae;--line:#343d47;--acc:#9bb5cc;--accink:#10202e;--ok:#7cc9a0;--okbg:#1c3328;--bad:#e59a8f;--badbg:#3a2420}}
:root[data-theme="dark"]{--bg:#171b20;--card:#1f252c;--ink:#e8ecf0;--mute:#98a3ae;--line:#343d47;--acc:#9bb5cc;--accink:#10202e;--ok:#7cc9a0;--okbg:#1c3328;--bad:#e59a8f;--badbg:#3a2420}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.45}
main{max-width:640px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.5rem;font-weight:800;margin:4px 0 14px}
.tabs{display:flex;gap:8px;margin-bottom:18px}
.tabs button{flex:1;padding:11px;border:2px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;font:inherit;font-weight:600;cursor:pointer}
.tabs button[aria-selected=true]{background:var(--acc);border-color:var(--acc);color:var(--accink)}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.meta{display:flex;justify-content:space-between;color:var(--mute);font-size:.9rem;margin-bottom:8px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:16px}
.bar i{display:block;height:100%;background:var(--acc);width:0;transition:width .2s}
.fc{width:100%;min-height:240px;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:24px;font:inherit;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px}
.fc .w{font-size:2.2rem;font-weight:800}
.fc .tr{font-size:2rem;font-weight:800;color:var(--acc)}
.fc .hint,.fc .syn{color:var(--mute);font-size:.95rem}
.row{display:flex;gap:8px;margin-top:14px}
.btn{flex:1;padding:12px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:600;cursor:pointer}
.btn.p{background:var(--acc);border-color:var(--acc);color:var(--accink)}
.q{font-size:2rem;font-weight:800;text-align:center;margin:10px 0 20px}
.opts{display:grid;gap:10px}
.opt{padding:14px 16px;text-align:left;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:1.05rem;cursor:pointer}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt:disabled{cursor:default;color:var(--ink)}
.fb{margin-top:14px;min-height:24px;font-weight:600}
.res{text-align:center}
.score{font-size:3rem;font-weight:800;color:var(--acc);margin:8px 0}
.miss{text-align:left;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:6px 16px;margin:16px 0;max-height:320px;overflow-y:auto}
.miss div{padding:8px 0;border-bottom:1px solid var(--line)}
.miss div:last-child{border:0}
.back{display:inline-block;margin-bottom:6px;color:var(--acc);text-decoration:none;font-weight:600}
.back:hover{text-decoration:underline}
.hide{display:none}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<main>
<a class="back" href="../">‹ SAT</a>
<h1>Expression of Ideas (EN–EN)</h1>
<div class="tabs" role="tablist">
<button role="tab" id="t-fc" aria-selected="true">Cards (100)</button>
<button role="tab" id="t-qz" aria-selected="false">Quiz (30 questions)</button>
</div>

<section id="fc-s">
<div class="meta"><span id="fc-n"></span><span>Tap to view meaning · Use ← → to navigate</span></div>
<div class="bar"><i id="fc-b"></i></div>
<button class="fc" id="fc" aria-live="polite"></button>
<div class="row">
<button class="btn" id="prev">Previous</button>
<button class="btn" id="shuf">Shuffle</button>
<button class="btn p" id="next">Next</button>
</div>
<div class="row"><button class="btn p" id="go-q">Start Quiz</button></div>
</section>

<section id="qz-s" class="hide">
<div id="qz"></div>
</section>
</main>
<script>
var RAW="V|imp|Emphasize|Give special importance;V|imp|Underscore|Stress a point;V|imp|Highlight|Draw attention to;V|show|Illustrate|Make clear through examples;V|show|Exemplify|Serve as an example;V|show|Demonstrate|Show with evidence;V|est|Establish|Prove or confirm;V|est|Substantiate|Support with evidence;V|est|Corroborate|Confirm with additional evidence;V|est|Support|Provide evidence for;V|ref|Challenge|Question the validity;V|ref|Counter|Oppose an argument;V|ref|Refute|Disprove with evidence;V|ref|Qualify|Limit or modify a claim;V|acc|Concede|Acknowledge a valid point;V|acc|Acknowledge|Recognize as valid;V|comp|Distinguish|Identify key differences;V|comp|Differentiate|Show how things differ;V|comp|Compare|Identify similarities or differences;V|comp|Contrast|Emphasize differences;V|desc|Characterize|Describe distinctive features;V|desc|Describe|Present relevant features;V|id|Identify|Specify or recognize;V|id|Introduce|Present a topic;V|sum|Summarize|Present essential points;V|sum|Synthesize|Combine information meaningfully;V|sum|Contextualize|Explain the broader context;V|sum|Trace|Follow a development;V|show|Indicate|Point toward or show;V|show|Suggest|Imply or propose;V|show|Imply|Communicate indirectly;V|show|Reveal|Make something apparent;V|attr|Attribute|Assign a cause or source;V|inf|Infer|Draw a logical conclusion;N|idea|Premise|Foundational assumption;N|data|Finding|Result of an investigation;N|data|Evidence|Information supporting a claim;N|data|Trend|General pattern of change;N|data|Correlation|Relationship between variables;N|data|Discrepancy|Inconsistency or difference;R|con|However|Introduces contrast;R|con|Nevertheless|Despite the preceding point;R|con|Nonetheless|Despite that;R|con|Conversely|Presents an opposite case;R|con|In contrast|Shows a difference;R|con|By contrast|Highlights a difference;R|con|Whereas|Contrasts two things;O|con|Although|Introduces a concession;R|con|Even so|Despite that;R|con|Despite this|Acknowledges an obstacle;O|con|Notwithstanding|Despite;R|alt|Alternatively|Presents another possibility;R|alt|Instead|Replaces an earlier option;R|alt|Rather|Corrects or contrasts;R|alt|Otherwise|Indicates a different outcome;R|res|Accordingly|Indicates a logical consequence;R|res|Consequently|Indicates a result;R|res|Therefore|Introduces a conclusion;R|res|Thus|Indicates a deduction;R|res|Hence|Indicates a consequence;R|res|As a result|Shows an outcome;R|res|For this reason|Explains a consequence;R|res|Thereby|Indicates the means;R|res|In turn|Shows a subsequent effect;R|time|Subsequently|Indicates later occurrence;R|time|Thereafter|After that point;R|time|Meanwhile|Indicates simultaneous events;R|time|Previously|Before the stated time;R|time|Initially|At the beginning;R|time|Ultimately|In the final outcome;R|time|Finally|At the last stage;R|spec|Specifically|Gives precise information;R|spec|Namely|Identifies something explicitly;R|spec|In particular|Focuses on one aspect;R|emph|Indeed|Reinforces a claim;R|emph|Notably|Highlights an important point;R|emph|Significantly|Emphasizes importance;R|acc|Admittedly|Acknowledges a limitation;R|acc|Certainly|Expresses confidence;R|acc|In fact|Strengthens or corrects;R|ex|For example|Introduces an example;R|ex|For instance|Introduces an example;R|ex|To illustrate|Provides an illustration;R|ex|In other words|Restates more clearly;R|ex|That is|Clarifies or specifies;R|sim|Similarly|Shows a resemblance;R|sim|Likewise|Indicates a parallel;R|sim|Correspondingly|Shows a related relationship;R|sim|Analogously|Draws a similar comparison;R|sim|By comparison|Introduces a comparison;R|add|In addition|Adds information;R|add|Furthermore|Adds supporting information;R|add|Moreover|Adds a reinforcing point;R|add|Additionally|Introduces another point;R|add|Equally|Indicates comparable importance;R|sup|Above all|Emphasizes greatest importance;R|sup|More importantly|Prioritizes a key point;R|sum|In short|Summarizes concisely;R|sum|Overall|Gives a general assessment;R|sum|In conclusion|Introduces a final judgment";
var T=RAW.split(";").map(function(r){var p=r.split("|");return{c:p[0],t:p[1]?p[1].split(","):[],en:p[2],tr:p[3]}}).filter(function(x){return x.en&&x.tr});
var $=function(i){return document.getElementById(i)};
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function show(tab){var f=tab==="fc";$("fc-s").classList.toggle("hide",!f);$("qz-s").classList.toggle("hide",f);$("t-fc").setAttribute("aria-selected",f);$("t-qz").setAttribute("aria-selected",!f);if(!f&&!quiz)startQuiz()}
$("t-fc").onclick=function(){show("fc")};$("t-qz").onclick=function(){show("qz")};$("go-q").onclick=function(){show("qz")};

/* Flashcards */
var deck=T.slice(),ci=0,flipped=false;
function drawCard(){var t=deck[ci],b=$("fc");
$("fc-n").textContent=(ci+1)+" / "+deck.length;$("fc-b").style.width=((ci+1)/deck.length*100)+"%";
if(!flipped){b.innerHTML='<div class="w"></div><div class="hint">Tap to view meaning</div>';b.firstChild.textContent=t.en}
else{b.innerHTML='<div class="tr"></div><div class="hint"></div>';
b.children[0].textContent=t.tr;b.children[1].textContent=t.en;}}
function move(d){ci=(ci+d+deck.length)%deck.length;flipped=false;drawCard()}
$("fc").onclick=function(){flipped=!flipped;drawCard()};
$("prev").onclick=function(){move(-1)};$("next").onclick=function(){move(1)};
$("shuf").onclick=function(){deck=shuffle(T);ci=0;flipped=false;drawCard()};
document.addEventListener("keydown",function(e){if($("fc-s").classList.contains("hide"))return;
if(e.key==="ArrowRight")move(1);else if(e.key==="ArrowLeft")move(-1);else if(e.key===" "&&document.activeElement.tagName!=="BUTTON"){e.preventDefault();flipped=!flipped;drawCard()}});
drawCard();

/* Quiz */
var quiz=null;
function uniqTr(list){var u=[],k={};shuffle(list).forEach(function(x){if(!k[x.tr]){k[x.tr]=1;u.push(x.tr)}});return u}
function makeQ(t){
var d=uniqTr(T.filter(function(x){return x.c===t.c&&x.tr!==t.tr}));
if(d.length<3){d=d.concat(uniqTr(T.filter(function(x){return x.tr!==t.tr&&d.indexOf(x.tr)<0})))}
return{en:t.en,ans:t.tr,opts:shuffle([t.tr].concat(d.slice(0,3)))}}
function startQuiz(){quiz={qs:shuffle(T).slice(0,30).map(makeQ),i:0,score:0,miss:[],done:false};drawQ()}
function drawQ(){var q=quiz,root=$("qz");
if(q.i>=q.qs.length){var m=q.miss.map(function(x){return"<div><b>"+x.en+"</b> = "+x.ans+"</div>"}).join("");
root.innerHTML='<div class="res"><div>Results</div><div class="score">'+q.score+' / '+q.qs.length+'</div>'+(q.miss.length?'<div>Missed words</div><div class="miss">'+m+'</div>':'<div>All correct!</div>')+'<div class="row"><button class="btn" id="again">New 30 questions</button><button class="btn p" id="tofc">Back to cards</button></div></div>';
$("again").onclick=startQuiz;$("tofc").onclick=function(){show("fc")};return}
var cur=q.qs[q.i];
root.innerHTML='<div class="meta"><span>Question '+(q.i+1)+' / '+q.qs.length+'</span><span>Score: '+q.score+'</span></div><div class="bar"><i style="width:'+(q.i/q.qs.length*100)+'%"></i></div><div class="q"></div><div class="opts"></div><div class="fb" aria-live="polite"></div><div class="row hide" id="nx"><button class="btn p" id="nxb"></button></div>';
root.querySelector(".q").textContent=cur.en;
var box=root.querySelector(".opts");
cur.opts.forEach(function(o){var b=document.createElement("button");b.className="opt";b.textContent=o;b.onclick=function(){pick(b,o)};box.appendChild(b)})}
function pick(btn,o){var q=quiz,cur=q.qs[q.i],all=document.querySelectorAll(".opt"),fb=document.querySelector(".fb");
all.forEach(function(b){b.disabled=true;if(b.textContent===cur.ans)b.classList.add("ok")});
if(o===cur.ans){q.score++;fb.textContent="Correct!"}else{btn.classList.add("bad");q.miss.push(cur);fb.textContent="Correct answer: "+cur.ans}
var last=q.i===q.qs.length-1;$("nx").classList.remove("hide");$("nxb").textContent=last?"See results":"Next question";
$("nxb").onclick=function(){q.i++;drawQ()};$("nxb").focus()}
</script>
</body>
</html>
