<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Information and Ideas (EN–TR)</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f4f7;--card:#fff;--ink:#222b36;--mute:#697685;--line:#d6dce3;--acc:#41586f;--accink:#fff;--ok:#2f7d5b;--okbg:#e5f3ec;--bad:#a8483c;--badbg:#f7e7e4;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171b20;--card:#1f252c;--ink:#e8ecf0;--mute:#98a3ae;--line:#343d47;--acc:#9bb5cc;--accink:#10202e;--ok:#7cc9a0;--okbg:#1c3328;--bad:#e59a8f;--badbg:#3a2420}}
:root[data-theme="dark"]{--bg:#171b20;--card:#1f252c;--ink:#e8ecf0;--mute:#98a3ae;--line:#343d47;--acc:#9bb5cc;--accink:#10202e;--ok:#7cc9a0;--okbg:#1c3328;--bad:#e59a8f;--badbg:#3a2420}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.45}
main{max-width:640px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.5rem;font-weight:800;margin:4px 0 14px}
.tabs{display:flex;gap:8px;margin-bottom:18px}
.tabs button{flex:1;padding:11px;border:2px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;font:inherit;font-weight:600;cursor:pointer}
.tabs button[aria-selected=true]{background:var(--acc);border-color:var(--acc);color:var(--accink)}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.meta{display:flex;justify-content:space-between;color:var(--mute);font-size:.9rem;margin-bottom:8px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:16px}
.bar i{display:block;height:100%;background:var(--acc);width:0;transition:width .2s}
.fc{width:100%;min-height:240px;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:24px;font:inherit;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px}
.fc .w{font-size:2.2rem;font-weight:800}
.fc .tr{font-size:2rem;font-weight:800;color:var(--acc)}
.fc .hint,.fc .syn{color:var(--mute);font-size:.95rem}
.row{display:flex;gap:8px;margin-top:14px}
.btn{flex:1;padding:12px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:600;cursor:pointer}
.btn.p{background:var(--acc);border-color:var(--acc);color:var(--accink)}
.q{font-size:2rem;font-weight:800;text-align:center;margin:10px 0 20px}
.opts{display:grid;gap:10px}
.opt{padding:14px 16px;text-align:left;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:1.05rem;cursor:pointer}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt:disabled{cursor:default;color:var(--ink)}
.fb{margin-top:14px;min-height:24px;font-weight:600}
.res{text-align:center}
.score{font-size:3rem;font-weight:800;color:var(--acc);margin:8px 0}
.miss{text-align:left;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:6px 16px;margin:16px 0;max-height:320px;overflow-y:auto}
.miss div{padding:8px 0;border-bottom:1px solid var(--line)}
.miss div:last-child{border:0}
.back{display:inline-block;margin-bottom:6px;color:var(--acc);text-decoration:none;font-weight:600}
.back:hover{text-decoration:underline}
.hide{display:none}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<main>
<a class="back" href="../">‹ SAT</a>
<h1>Information and Ideas (EN–TR)</h1>
<div class="tabs" role="tablist">
<button role="tab" id="t-fc" aria-selected="true">Kartlar (200)</button>
<button role="tab" id="t-qz" aria-selected="false">Test (30 soru)</button>
</div>

<section id="fc-s">
<div class="meta"><span id="fc-n"></span><span>Çevirmek için dokun · ← → ile gez</span></div>
<div class="bar"><i id="fc-b"></i></div>
<button class="fc" id="fc" aria-live="polite"></button>
<div class="row">
<button class="btn" id="prev">Önceki</button>
<button class="btn" id="shuf">Karıştır</button>
<button class="btn p" id="next">Sonraki</button>
</div>
<div class="row"><button class="btn p" id="go-q">Teste geç</button></div>
</section>

<section id="qz-s" class="hide">
<div id="qz"></div>
</section>
</main>
<script>
var RAW="V|rem|Abandon|Terk etmek;V|down|Abate|Azalmak;J|size|Abundant|Bol;V|up|Accelerate|Hızlandırmak;V|chg|Accommodate|Uyarlamak;V|get|Accumulate|Biriktirmek;V|acc|Acknowledge|Tanımak;V|sup|Advocate|Savunmak;V|org|Allocate|Dağıtmak;V|chg|Alter|Değiştirmek;J|doubt|Ambiguous|Belirsiz;J|size|Ample|Yeterli;J|sim|Analogous|Benzer;N|diff|Anomaly|Sapma;V|inf|Anticipate|Öngörmek;J|clear|Apparent|Belirgin;J|doubt|Arbitrary|Keyfî;V|claim|Assert|İddia etmek;V|eval|Assess|Değerlendirmek;V|attr|Attribute|Atfetmek;J|cert|Authentic|Özgün;V|up|Bolster|Güçlendirmek;V|rem|Cease|Bitirmek;J|logic|Coherent|Tutarlı;V|sim|Coincide|Örtüşmek;J|cert|Compelling|İkna edici;V|org|Compensate|Telafi etmek;V|get|Compile|Derlemek;V|up|Complement|Tamamlamak;V|org|Comprise|İçermek;V|idea|Conceive|Tasarlamak;J|cert|Conclusive|Kesin;V|down|Condense|Kısaltmak;N|idea|Conjecture|Varsayım;N|acc|Consensus|Uzlaşı;R|res|Consequently|Dolayısıyla;V|lim|Constrain|Kısıtlamak;V|claim|Contend|Savunmak;V|ref|Contradict|Çelişmek;J|trad|Conventional|Geleneksel;V|desc|Convey|Aktarmak;V|est|Corroborate|Doğrulamak;J|imp|Crucial|Kritik;J|up|Cumulative|Birikimli;V|eval|Deem|Saymak;V|down|Diminish|Azaltmak;N|diff|Discrepancy|Tutarsızlık;J|diff|Discrete|Ayrı;N|diff|Disparity|Eşitsizlik;V|ref|Dispute|İtiraz etmek;J|diff|Distinct|Farklı;J|diff|Diverse|Çeşitli;V|up|Dominate|Egemen olmak;V|desc|Elucidate|Açıklamak;V|imp|Emphasize|Vurgulamak;J|data|Empirical|Deneysel;V|up|Enhance|Geliştirmek;V|est|Establish|Kanıtlamak;V|up|Exaggerate|Abartmak;V|up|Exceed|Aşmak;V|rem|Exclude|Dışlamak;J|clear|Explicit|Açık;V|act|Exploit|Kullanmak;V|sup|Facilitate|Kolaylaştırmak;J|cert|Feasible|Mümkün;V|chg|Fluctuate|Dalgalanmak;J|imp|Fundamental|Temel;V|ca|Generate|Üretmek;J|cert|Genuine|Gerçek;V|claim|Hypothesize|Varsaymak;V|show|Imply|İma etmek;V|lim|Impose|Dayatmak;J|size|Inadequate|Yetersiz;N|goal|Incentive|Teşvik;J|imp|Incidental|Tesadüfi;V|org|Incorporate|Katmak;V|show|Indicate|Göstermek;V|inf|Infer|Çıkarsamak;J|cert|Inherent|İçkin;V|lim|Inhibit|Engellemek;J|time|Initial|İlk;J|new|Innovative|Yenilikçi;V|org|Integrate|Bütünleştirmek;V|desc|Interpret|Yorumlamak;J|comp|Intricate|Karmaşık;V|sup|Justify|Gerekçelendirmek;R|emph|Largely|Çoğunlukla;V|show|Manifest|Göstermek;J|size|Marginal|Marjinal;V|chg|Modify|Değiştirmek;J|imp|Notable|Önemli;N|idea|Notion|Kavram;V|get|Obtain|Edinmek;V|rem|Omit|Atlamak;V|org|Offset|Dengelemek;N|diff|Paradox|Paradoks;J|imp|Paramount|Üstün;V|acc|Perceive|Algılamak;V|keep|Persist|Sürdürmek;J|cert|Plausible|Makul;V|time|Precede|Öncelemek;J|imp|Predominant|Baskın;V|keep|Preserve|Korumak;V|claim|Presume|Varsaymak;V|up|Prevail|Hükmetmek;V|lim|Prohibit|Yasaklamak;V|sup|Promote|Desteklemek;N|sup|Proponent|Savunucu;N|data|Proportion|Oran;V|act|Pursue|İzlemek;J|logic|Rational|Mantıklı;V|acc|Reconcile|Uzlaştırmak;V|chg|Refine|İyileştirmek;V|up|Reinforce|Pekiştirmek;V|ref|Reject|Reddetmek;J|imp|Relevant|İlgili;J|doubt|Reluctant|İsteksiz;J|imp|Remarkable|Olağanüstü;V|ca|Render|Kılmak;V|sim|Replicate|Çoğaltmak;V|keep|Retain|Korumak;V|show|Reveal|Açıklamak;J|lim|Rigid|Katı;J|cert|Robust|Sağlam;J|size|Scarce|Kıt;V|exam|Scrutinize|İncelemek;J|time|Simultaneous|Eşzamanlı;J|imp|Subordinate|İkincil;J|time|Subsequent|Sonraki;J|size|Substantial|Kayda değer;V|est|Substantiate|Kanıtlamak;V|chg|Substitute|Değiştirmek;J|comp|Subtle|İnce;J|size|Sufficient|Yeterli;V|up|Surpass|Aşmak;V|keep|Sustain|Sürdürmek;J|doubt|Tentative|Geçici;J|idea|Theoretical|Kuramsal;V|ref|Undermine|Zayıflatmak;J|imp|Underlying|Temel;J|new|Unprecedented|Eşsiz;J|logic|Valid|Geçerli;V|diff|Vary|Değişmek;J|cert|Viable|Uygulanabilir;V|sup|Warrant|Gerektirmek;V|ca|Yield|Üretmek;V|rem|Abolish|Kaldırmak;J|idea|Abstract|Soyut;J|tone_neg|Adverse|Olumsuz;N|rel|Affinity|Yakınlık;V|down|Alleviate|Hafifletmek;J|tone_pos|Assertive|Atılgan;V|get|Attain|Ulaşmak;V|attr|Attribute|Atfetmek;N|bias|Bias|Önyargı;J|tone_neu|Cautious|Temkinli;V|rem|Circumvent|Atlatmak;V|desc|Clarify|Açıklamak;V|hide|Conceal|Gizlemek;J|time|Concurrent|Eşzamanlı;V|lim|Confine|Sınırlamak;V|acc|Conform|Uymak;J|sim|Consistent|Tutarlı;V|exam|Contemplate|Düşünmek;J|diff|Contrasting|Zıt;V|down|Deplete|Tüketmek;V|get|Derive|Türetmek;V|id|Detect|Saptamak;V|ca|Devise|Tasarlamak;J|tone_neg|Detrimental|Zararlı;V|rem|Discard|Atmak;V|show|Disclose|Açıklamak;V|ref|Disrupt|Bozmak;V|show|Emerge|Belirmek;V|sup|Endorse|Onaylamak;V|chg|Evolve|Evrilmek;V|up|Exacerbate|Kötüleştirmek;V|act|Exert|Uygulamak;V|sup|Foster|Geliştirmek;V|lim|Hinder|Engellemek;V|show|Illustrate|Örneklemek;N|diff|Inconsistency|Tutarsızlık;J|imp|Indispensable|Vazgeçilmez;J|size|Infrequent|Seyrek;V|up|Intensify|Yoğunlaştırmak;J|cert|Intrinsic|Özsel;V|ref|Negate|Geçersizleştirmek;V|hide|Obscure|Belirsiz;V|keep|Persist|Sürmek;J|size|Prevalent|Yaygın;V|lim|Prohibit|Yasaklamak;V|up|Proliferate|Çoğalmak;V|ca|Prompt|Tetiklemek;V|ca|Provoke|Kışkırtmak;V|sim|Resemble|Benzemek;J|cert|Resilient|Dayanıklı;V|lim|Restrict|Sınırlamak;J|imp|Significant|Önemli;V|up|Supplement|Tamamlamak;V|chg|Transform|Dönüştürmek";
var T=RAW.split(";").map(function(r){var p=r.split("|");return{c:p[0],t:p[1]?p[1].split(","):[],en:p[2],tr:p[3]}}).filter(function(x){return x.en&&x.tr});
var $=function(i){return document.getElementById(i)};
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function show(tab){var f=tab==="fc";$("fc-s").classList.toggle("hide",!f);$("qz-s").classList.toggle("hide",f);$("t-fc").setAttribute("aria-selected",f);$("t-qz").setAttribute("aria-selected",!f);if(!f&&!quiz)startQuiz()}
$("t-fc").onclick=function(){show("fc")};$("t-qz").onclick=function(){show("qz")};$("go-q").onclick=function(){show("qz")};

/* Flashcards */
var deck=T.slice(),ci=0,flipped=false;
function drawCard(){var t=deck[ci],b=$("fc");
$("fc-n").textContent=(ci+1)+" / "+deck.length;$("fc-b").style.width=((ci+1)/deck.length*100)+"%";
if(!flipped){b.innerHTML='<div class="w"></div><div class="hint">Tanım için dokun</div>';b.firstChild.textContent=t.en}
else{b.innerHTML='<div class="tr"></div><div class="hint"></div>';
b.children[0].textContent=t.tr;b.children[1].textContent=t.en;}}
function move(d){ci=(ci+d+deck.length)%deck.length;flipped=false;drawCard()}
$("fc").onclick=function(){flipped=!flipped;drawCard()};
$("prev").onclick=function(){move(-1)};$("next").onclick=function(){move(1)};
$("shuf").onclick=function(){deck=shuffle(T);ci=0;flipped=false;drawCard()};
document.addEventListener("keydown",function(e){if($("fc-s").classList.contains("hide"))return;
if(e.key==="ArrowRight")move(1);else if(e.key==="ArrowLeft")move(-1);else if(e.key===" "&&document.activeElement.tagName!=="BUTTON"){e.preventDefault();flipped=!flipped;drawCard()}});
drawCard();

/* Quiz */
var quiz=null;
function uniqTr(list){var u=[],k={};shuffle(list).forEach(function(x){if(!k[x.tr]){k[x.tr]=1;u.push(x.tr)}});return u}
function makeQ(t){
var d=uniqTr(T.filter(function(x){return x.c===t.c&&x.tr!==t.tr}));
if(d.length<3){d=d.concat(uniqTr(T.filter(function(x){return x.tr!==t.tr&&d.indexOf(x.tr)<0})))}
return{en:t.en,ans:t.tr,opts:shuffle([t.tr].concat(d.slice(0,3)))}}
function startQuiz(){quiz={qs:shuffle(T).slice(0,30).map(makeQ),i:0,score:0,miss:[],done:false};drawQ()}
function drawQ(){var q=quiz,root=$("qz");
if(q.i>=q.qs.length){var m=q.miss.map(function(x){return"<div><b>"+x.en+"</b> = "+x.ans+"</div>"}).join("");
root.innerHTML='<div class="res"><div>Sonuç</div><div class="score">'+q.score+' / '+q.qs.length+'</div>'+(q.miss.length?'<div>Yanlış yaptıkların</div><div class="miss">'+m+'</div>':'<div>Hepsi doğru!</div>')+'<div class="row"><button class="btn" id="again">Yeni 30 soru</button><button class="btn p" id="tofc">Kartlara dön</button></div></div>';
$("again").onclick=startQuiz;$("tofc").onclick=function(){show("fc")};return}
var cur=q.qs[q.i];
root.innerHTML='<div class="meta"><span>Soru '+(q.i+1)+' / '+q.qs.length+'</span><span>Doğru: '+q.score+'</span></div><div class="bar"><i style="width:'+(q.i/q.qs.length*100)+'%"></i></div><div class="q"></div><div class="opts"></div><div class="fb" aria-live="polite"></div><div class="row hide" id="nx"><button class="btn p" id="nxb"></button></div>';
root.querySelector(".q").textContent=cur.en;
var box=root.querySelector(".opts");
cur.opts.forEach(function(o){var b=document.createElement("button");b.className="opt";b.textContent=o;b.onclick=function(){pick(b,o)};box.appendChild(b)})}
function pick(btn,o){var q=quiz,cur=q.qs[q.i],all=document.querySelectorAll(".opt"),fb=document.querySelector(".fb");
all.forEach(function(b){b.disabled=true;if(b.textContent===cur.ans)b.classList.add("ok")});
if(o===cur.ans){q.score++;fb.textContent="Doğru!"}else{btn.classList.add("bad");q.miss.push(cur);fb.textContent="Doğru cevap: "+cur.ans}
var last=q.i===q.qs.length-1;$("nx").classList.remove("hide");$("nxb").textContent=last?"Sonucu gör":"Sonraki soru";
$("nxb").onclick=function(){q.i++;drawQ()};$("nxb").focus()}
</script>
</body>
</html>
