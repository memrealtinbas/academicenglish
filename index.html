<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Academic English</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f4f7;--card:#fff;--ink:#222b36;--mute:#697685;--line:#d6dce3;--acc:#41586f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#171b20;--card:#1f252c;--ink:#e8ecf0;--mute:#98a3ae;--line:#343d47;--acc:#9bb5cc}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.45}
main{max-width:640px;margin:0 auto;padding:32px 16px 56px}
h1{font-size:2rem;font-weight:800;margin:0 0 6px}
.sub{color:var(--mute);margin:0 0 28px}
.list{display:grid;gap:12px}
.item{display:block;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:18px 20px;color:inherit;text-decoration:none}
.item:hover{border-color:var(--acc)}
.item:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.item b{display:block;font-size:1.15rem;color:var(--acc)}
.item span{color:var(--mute);font-size:.95rem}
</style>
</head>
<body>
<main>
<h1>Academic English</h1>
<p class="sub">Vocabulary flashcards and quizzes</p>

<div class="list">

</a>

</main>
</body>
</html>
